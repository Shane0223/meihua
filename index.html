<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>梅花數占</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 單欄卦盤：上方起卦，下方依序展開本卦・互卦・變卦 → 體用 → 經文。朱砂只標動爻與凶。 */
:root{
  --bg:#ECEFEA; --surface:#F7F8F5; --fg:#1C221F; --muted:#5B6862; --line:#C8D0C9;
  --jade:#3D6C5C; --jade-soft:#DCE6E0; --cinnabar:#AF3528; --cin-soft:#F3DEDA; --ochre:#86661C; --ochre-soft:#EFE6CF;
  --display:"LXGW WenKai TC","Kaiti TC","STKaiti","KaiTi",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1{font-family:var(--display);font-weight:700;font-size:2.4rem;line-height:1.1;margin:0;letter-spacing:.06em}
.sub{color:var(--muted);margin:6px 0 0;font-size:.92rem}
h2{font-family:var(--display);font-size:1.35rem;margin:0 0 12px;font-weight:700;letter-spacing:.04em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;background:transparent;color:var(--muted);border:0;padding:6px 16px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--jade);color:var(--surface)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:14px}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:1rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:14px}
.check{flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-size:.95rem}
.check input{width:auto}
.go{font:inherit;font-family:var(--display);font-size:1.15rem;letter-spacing:.2em;background:var(--fg);color:var(--bg);border:0;border-radius:8px;padding:10px 28px;cursor:pointer}
.ghost{font:inherit;font-size:.9rem;background:transparent;color:var(--jade);border:1px solid var(--jade);border-radius:6px;padding:6px 14px;cursor:pointer}
.err{color:var(--cinnabar);font-size:.9rem;margin:10px 0 0}
.example{font-size:.8rem;color:var(--ochre);background:var(--ochre-soft);border-radius:4px;padding:2px 8px;margin-left:8px;vertical-align:middle}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gua{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.gua .role{font-size:.78rem;letter-spacing:.2em;color:var(--muted)}
.gua .nm{font-family:var(--display);font-size:1.7rem;line-height:1.1}
.gua .full{font-size:.85rem;color:var(--muted)}
.lines{display:flex;flex-direction:column;gap:7px;width:min(88px,100%);margin:6px 0}
.ln{height:11px;display:flex;justify-content:space-between;position:relative}
.ln i{display:block;height:100%;background:var(--fg);border-radius:2px}
.ln.yang i{width:100%}.ln.yin i{width:42%}
.ln.mv i{background:var(--cinnabar)}
.ln.mv::after{content:"";position:absolute;right:-14px;top:2px;width:7px;height:7px;border-radius:50%;background:var(--cinnabar)}
.gap{height:6px}
.tri{font-size:.82rem;color:var(--muted);line-height:1.5}
.tri b{color:var(--fg);font-weight:500}
.tag{font-size:.72rem;padding:0 5px;border-radius:3px;margin-left:3px}
.tag.ti{background:var(--jade-soft);color:var(--jade)}.tag.yong{background:var(--cin-soft);color:var(--cinnabar)}
.steps{font-size:.85rem;color:var(--muted);margin-top:14px;border-top:1px dashed var(--line);padding-top:10px;font-variant-numeric:tabular-nums}
.verdict{display:flex;flex-direction:column;gap:10px}
.vrow{display:grid;grid-template-columns:4em 1fr;gap:10px;align-items:start}
.vrow .k{font-family:var(--display);font-size:1.05rem;color:var(--muted)}
.vrow .v{min-width:0}
.pill{display:inline-block;font-size:.8rem;font-weight:700;padding:1px 9px;border-radius:999px;margin-right:6px}
.good{background:var(--jade-soft);color:var(--jade)}.bad{background:var(--cin-soft);color:var(--cinnabar)}.mid{background:var(--ochre-soft);color:var(--ochre)}
.wx{font-variant-numeric:tabular-nums}
.sum{margin-top:6px;padding-top:12px;border-top:1px solid var(--line)}
.text h3{font-family:var(--display);font-size:1.1rem;margin:0 0 4px;font-weight:700}
.text p{margin:0}
.text .block{padding:10px 0;border-bottom:1px solid var(--line)}
.text .block:last-child{border-bottom:0}
.text .hl{background:var(--cin-soft);border-radius:8px;padding:12px 14px;border:0;margin:6px 0}
.text .hl h3{color:var(--cinnabar)}
.jing{font-family:var(--display);font-size:1.12rem;line-height:1.8}
details summary{cursor:pointer;color:var(--jade);font-size:.9rem;margin-top:8px}
details ol{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:4px}
details li{font-family:var(--display);font-size:1rem}
details li span{color:var(--muted);font-family:var(--body);font-size:.85rem;margin-right:8px;display:inline-block;width:2.6em}
details li.on{color:var(--cinnabar)}
.foot{font-size:.82rem;color:var(--muted)}
.foot p{margin:0 0 6px}
#copybox{width:100%;min-height:120px;margin-top:10px;font-size:.85rem}
.ai-btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ai-out{white-space:pre-wrap;font-size:1rem;line-height:1.9;margin-top:14px;min-width:0;overflow-wrap:anywhere}
.ai-out:empty{display:none}
.ai-out.wait{color:var(--muted)}
.ai-note{font-size:.85rem;color:var(--muted);margin:8px 0 0}
.go.small{display:inline-block;text-decoration:none;font-size:1rem;padding:8px 20px;letter-spacing:.1em}
.go:disabled{opacity:.5;cursor:default}
@media (max-width:420px){h1{font-size:2rem}.gua .nm{font-size:1.35rem}.lines{width:min(68px,100%)}}
@media (prefers-reduced-motion:no-preference){#result{transition:opacity .25s}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>梅花數占</h1>
    <p class="sub">梅花易數・數字起卦。算出本卦、互卦、變卦，依體用五行與月令旺衰判斷吉凶，附《周易》卦辭與爻辭。</p>
  </header>

  <section class="panel" aria-label="起卦">
    <div class="seg" role="group" aria-label="起卦方式">
      <button id="m2" type="button" aria-pressed="true">兩數起卦</button>
      <button id="m3" type="button" aria-pressed="false">三數起卦</button>
    </div>
    <form id="f" novalidate>
      <div class="fields">
        <label for="q" style="grid-column:1/-1">所問之事（可留空）<input id="q" type="text" placeholder="例：這檔股票可不可以買"></label>
        <label for="a">第一數（上卦）<input id="a" inputmode="numeric" autocomplete="off"></label>
        <label for="b">第二數（下卦）<input id="b" inputmode="numeric" autocomplete="off"></label>
        <label for="c" id="cWrap" hidden>第三數（動爻）<input id="c" inputmode="numeric" autocomplete="off"></label>
        <label for="d">占卜日期（定月令）<input id="d" type="date"></label>
        <label for="h">時辰<select id="h"></select></label>
      </div>
      <div class="row">
        <label class="check" for="useH" id="useHWrap"><input id="useH" type="checkbox"> 動爻加入時辰數</label>
      </div>
      <div class="row">
        <button class="go" type="submit">起卦</button>
        <span id="status" role="status" style="color:var(--jade);font-size:.95rem"></span>
      </div>
      <p class="err" id="err" hidden></p>
    </form>
  </section>

  <div id="result" style="display:flex;flex-direction:column;gap:28px"></div>

  <section class="panel foot" aria-label="起卦規則">
    <h2>起卦規則</h2>
    <p><b>兩數起卦</b>：第一數除以 8 取餘數為上卦，第二數除以 8 取餘數為下卦；兩數相加（勾選時再加時辰數）除以 6 取餘數為動爻。</p>
    <p><b>三數起卦</b>：前兩數同上，第三數除以 6 取餘數為動爻。</p>
    <p>餘數為 0 時，卦取 8（坤），爻取 6（上爻）。先天八卦數：乾一、兌二、離三、震四、巽五、坎六、艮七、坤八。時辰數：子一、丑二，依序至亥十二。</p>
    <p><b>體用</b>：動爻所在的經卦為用，另一經卦為體。互卦看過程，變卦看結果。</p>
    <p><b>月令</b>依節氣交接日推算（各年可能差一天），節氣交接當天占卜請自行核對。</p>
  </section>
</div>

<script>
const TRI={
  乾:{b:[1,1,1],n:1,img:'天',el:'金'},兌:{b:[1,1,0],n:2,img:'澤',el:'金'},
  離:{b:[1,0,1],n:3,img:'火',el:'火'},震:{b:[1,0,0],n:4,img:'雷',el:'木'},
  巽:{b:[0,1,1],n:5,img:'風',el:'木'},坎:{b:[0,1,0],n:6,img:'水',el:'水'},
  艮:{b:[0,0,1],n:7,img:'山',el:'土'},坤:{b:[0,0,0],n:8,img:'地',el:'土'}};
const ORDER=['乾','兌','離','震','巽','坎','艮','坤'];
const triOf=bits=>ORDER.find(k=>TRI[k].b.join('')===bits.join(''));

// 名|上下|卦辭|初|二|三|四|五|上
const RAW=`乾|乾乾|元亨利貞。|潛龍勿用。|見龍在田，利見大人。|君子終日乾乾，夕惕若厲，無咎。|或躍在淵，無咎。|飛龍在天，利見大人。|亢龍有悔。
坤|坤坤|元亨，利牝馬之貞。君子有攸往，先迷後得主，利。西南得朋，東北喪朋。安貞吉。|履霜，堅冰至。|直方大，不習無不利。|含章可貞。或從王事，無成有終。|括囊，無咎無譽。|黃裳，元吉。|龍戰于野，其血玄黃。
屯|坎震|元亨利貞。勿用有攸往，利建侯。|磐桓，利居貞，利建侯。|屯如邅如，乘馬班如。匪寇婚媾，女子貞不字，十年乃字。|即鹿無虞，惟入于林中。君子幾不如舍，往吝。|乘馬班如，求婚媾，往吉，無不利。|屯其膏，小貞吉，大貞凶。|乘馬班如，泣血漣如。
蒙|艮坎|亨。匪我求童蒙，童蒙求我。初筮告，再三瀆，瀆則不告。利貞。|發蒙，利用刑人，用說桎梏，以往吝。|包蒙吉，納婦吉，子克家。|勿用取女，見金夫，不有躬，無攸利。|困蒙，吝。|童蒙，吉。|擊蒙，不利為寇，利禦寇。
需|坎乾|有孚，光亨，貞吉，利涉大川。|需于郊，利用恆，無咎。|需于沙，小有言，終吉。|需于泥，致寇至。|需于血，出自穴。|需于酒食，貞吉。|入于穴，有不速之客三人來，敬之終吉。
訟|乾坎|有孚窒惕，中吉，終凶。利見大人，不利涉大川。|不永所事，小有言，終吉。|不克訟，歸而逋，其邑人三百戶，無眚。|食舊德，貞厲，終吉。或從王事，無成。|不克訟，復即命渝，安貞吉。|訟，元吉。|或錫之鞶帶，終朝三褫之。
師|坤坎|貞，丈人吉，無咎。|師出以律，否臧凶。|在師中，吉無咎，王三錫命。|師或輿尸，凶。|師左次，無咎。|田有禽，利執言，無咎。長子帥師，弟子輿尸，貞凶。|大君有命，開國承家，小人勿用。
比|坎坤|吉。原筮，元永貞，無咎。不寧方來，後夫凶。|有孚比之，無咎。有孚盈缶，終來有他吉。|比之自內，貞吉。|比之匪人。|外比之，貞吉。|顯比，王用三驅，失前禽，邑人不誡，吉。|比之無首，凶。
小畜|巽乾|亨。密雲不雨，自我西郊。|復自道，何其咎，吉。|牽復，吉。|輿說輻，夫妻反目。|有孚，血去惕出，無咎。|有孚攣如，富以其鄰。|既雨既處，尚德載，婦貞厲。月幾望，君子征凶。
履|乾兌|履虎尾，不咥人，亨。|素履，往無咎。|履道坦坦，幽人貞吉。|眇能視，跛能履，履虎尾，咥人，凶。武人為于大君。|履虎尾，愬愬，終吉。|夬履，貞厲。|視履考祥，其旋元吉。
泰|坤乾|小往大來，吉亨。|拔茅茹，以其彙，征吉。|包荒，用馮河，不遐遺，朋亡，得尚于中行。|無平不陂，無往不復，艱貞無咎。勿恤其孚，于食有福。|翩翩，不富以其鄰，不戒以孚。|帝乙歸妹，以祉元吉。|城復于隍，勿用師。自邑告命，貞吝。
否|乾坤|否之匪人，不利君子貞，大往小來。|拔茅茹，以其彙，貞吉亨。|包承，小人吉，大人否亨。|包羞。|有命無咎，疇離祉。|休否，大人吉。其亡其亡，繫于苞桑。|傾否，先否後喜。
同人|乾離|同人于野，亨。利涉大川，利君子貞。|同人于門，無咎。|同人于宗，吝。|伏戎于莽，升其高陵，三歲不興。|乘其墉，弗克攻，吉。|同人，先號咷而後笑，大師克相遇。|同人于郊，無悔。
大有|離乾|元亨。|無交害，匪咎，艱則無咎。|大車以載，有攸往，無咎。|公用亨于天子，小人弗克。|匪其彭，無咎。|厥孚交如，威如，吉。|自天祐之，吉無不利。
謙|坤艮|亨，君子有終。|謙謙君子，用涉大川，吉。|鳴謙，貞吉。|勞謙君子，有終，吉。|無不利，撝謙。|不富以其鄰，利用侵伐，無不利。|鳴謙，利用行師，征邑國。
豫|震坤|利建侯行師。|鳴豫，凶。|介于石，不終日，貞吉。|盱豫，悔。遲有悔。|由豫，大有得。勿疑，朋盍簪。|貞疾，恆不死。|冥豫，成有渝，無咎。
隨|兌震|元亨利貞，無咎。|官有渝，貞吉。出門交有功。|係小子，失丈夫。|係丈夫，失小子。隨有求得，利居貞。|隨有獲，貞凶。有孚在道，以明，何咎。|孚于嘉，吉。|拘係之，乃從維之。王用亨于西山。
蠱|艮巽|元亨，利涉大川。先甲三日，後甲三日。|幹父之蠱，有子，考無咎，厲終吉。|幹母之蠱，不可貞。|幹父之蠱，小有悔，無大咎。|裕父之蠱，往見吝。|幹父之蠱，用譽。|不事王侯，高尚其事。
臨|坤兌|元亨利貞。至于八月有凶。|咸臨，貞吉。|咸臨，吉無不利。|甘臨，無攸利。既憂之，無咎。|至臨，無咎。|知臨，大君之宜，吉。|敦臨，吉無咎。
觀|巽坤|盥而不薦，有孚顒若。|童觀，小人無咎，君子吝。|闚觀，利女貞。|觀我生，進退。|觀國之光，利用賓于王。|觀我生，君子無咎。|觀其生，君子無咎。
噬嗑|離震|亨。利用獄。|屨校滅趾，無咎。|噬膚滅鼻，無咎。|噬腊肉，遇毒，小吝，無咎。|噬乾胏，得金矢，利艱貞，吉。|噬乾肉，得黃金，貞厲，無咎。|何校滅耳，凶。
賁|艮離|亨。小利有攸往。|賁其趾，舍車而徒。|賁其須。|賁如濡如，永貞吉。|賁如皤如，白馬翰如，匪寇婚媾。|賁于丘園，束帛戔戔，吝，終吉。|白賁，無咎。
剝|艮坤|不利有攸往。|剝床以足，蔑貞凶。|剝床以辨，蔑貞凶。|剝之，無咎。|剝床以膚，凶。|貫魚，以宮人寵，無不利。|碩果不食，君子得輿，小人剝廬。
復|坤震|亨。出入無疾，朋來無咎。反復其道，七日來復，利有攸往。|不遠復，無祇悔，元吉。|休復，吉。|頻復，厲無咎。|中行獨復。|敦復，無悔。|迷復，凶，有災眚。用行師，終有大敗，以其國君凶，至于十年不克征。
無妄|乾震|元亨利貞。其匪正有眚，不利有攸往。|無妄，往吉。|不耕穫，不菑畬，則利有攸往。|無妄之災，或繫之牛，行人之得，邑人之災。|可貞，無咎。|無妄之疾，勿藥有喜。|無妄，行有眚，無攸利。
大畜|艮乾|利貞。不家食吉，利涉大川。|有厲，利已。|輿說輹。|良馬逐，利艱貞。曰閑輿衛，利有攸往。|童牛之牿，元吉。|豶豕之牙，吉。|何天之衢，亨。
頤|艮震|貞吉。觀頤，自求口實。|舍爾靈龜，觀我朵頤，凶。|顛頤，拂經，于丘頤，征凶。|拂頤，貞凶，十年勿用，無攸利。|顛頤，吉。虎視眈眈，其欲逐逐，無咎。|拂經，居貞吉，不可涉大川。|由頤，厲吉，利涉大川。

  const R={a,b,c,ru,rl,yr,yaoSrc,up,lo,lines,ben,hu,huUp,huLo,bian,bUp,bLo,bl,yongUpper,tiT,yongT,bianYong,tiEl,yongEl,mb,lingEl,wsTi,wsYong,rMain,rHu1,rHu2,rBian,q,Y,M,D,isExample};
  render(R);
  if(!isExample){
    $('status').textContent=`已起卦：${R.ben.full}，動爻${yaoLabel(R.yr,R.lines[R.yr-1])}`;
    const res=$('result');
    res.style.opacity='0.2';
    requestAnimationFrame(()=>{res.style.opacity='1';});
    res.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});
  }
}

function linesHTML(ls,mv){
  let h='<div class="lines" aria-hidden="true">';
  for(let i=5;i>=0;i--){
    const y=ls[i];
    h+=`<div class="ln ${y?'yang':'yin'}${mv===i+1?' mv':''}">${y?'<i></i>':'<i></i><i></i>'}</div>`;
    if(i===3) h+='<div class="gap"></div>';
  }
  return h+'</div>';
}
function guaCard(role,g,ls,mv,triTxt){
  return `<div class="gua"><div class="role">${role}</div><div class="nm">${g.name}</div><div class="full">${g.full}・第${g.no}卦</div>${linesHTML(ls,mv)}<div class="tri">${triTxt}</div></div>`;
}
const triLine=(pos,t,tag)=>`${pos} <b>${t}${TRI[t].el}</b>${tag||''}`;

function render(R){
  const tiTag='<span class="tag ti">體</span>', yongTag='<span class="tag yong">用</span>';
  const benTri=triLine('上',R.up,R.yongUpper?yongTag:tiTag)+'<br>'+triLine('下',R.lo,R.yongUpper?tiTag:yongTag);
  const huTri=triLine('上',R.huUp)+'<br>'+triLine('下',R.huLo);
  const bianTri=triLine('上',R.bUp)+'<br>'+triLine('下',R.bLo);
  const mvLabel=yaoLabel(R.yr,R.lines[R.yr-1]);
  const yaoText=R.ben.yao[R.yr-1];
  const ws=(el,w)=>`${el}・${w}`;
  const tiStrong=['旺','相'].includes(R.wsTi);

  const pill=r=>`<span class="pill ${r.cls}">${r.k}</span>`;
  const huWorst=[R.rHu1,R.rHu2];
  const html=`
  <section class="panel" aria-label="卦象">
    <h2>卦象${R.isExample?'<span class="example">範例：16、7，動爻五</span>':''}</h2>
    ${R.q?`<p style="margin:-4px 0 14px;color:var(--muted)">問：${esc(R.q)}</p>`:''}
    <div class="trio">
      ${guaCard('本卦',R.ben,R.lines,R.yr,benTri)}
      ${guaCard('互卦',R.hu,[...TRI[R.huLo].b,...TRI[R.huUp].b],0,huTri)}
      ${guaCard('變卦',R.bian,R.bl,0,bianTri)}
    </div>
    <div class="steps">
      上卦：${R.a} ÷ 8 餘 ${modStr(R.a,8)}${modStr(R.a,8)?'':'（取 8）'} → ${R.up}<br>
      下卦：${R.b} ÷ 8 餘 ${modStr(R.b,8)}${modStr(R.b,8)?'':'（取 8）'} → ${R.lo}<br>
      動爻：${R.yaoSrc}${R.yaoSrc.endsWith('餘 0')?'（取 6）':''} → 第 ${R.yr} 爻（${mvLabel}）<br>
      月令：${R.Y}/${R.M}/${R.D} 在${JIE_NAME[R.mb]}之後，屬${R.mb}月，${R.lingEl}當令
    </div>
  </section>

  <section class="panel" aria-label="體用">
    <h2>體用生剋</h2>
    <p style="margin:-4px 0 14px;color:var(--muted);font-size:.9rem">體卦代表你自己，用卦代表你問的事。看兩者的五行是互相幫忙還是互相壓制，再看這個月對誰有利。</p>
    <div class="verdict">
      <div class="vrow"><div class="k">你</div><div class="v wx">體卦 ${R.tiT}　${ws(R.tiEl,R.wsTi)}　<span style="color:var(--muted)">${WS_NOTE[R.wsTi]}</span></div></div>
      <div class="vrow"><div class="k">事</div><div class="v wx">用卦 ${R.yongT}　${ws(R.yongEl,R.wsYong)}　<span style="color:var(--muted)">${WS_NOTE[R.wsYong]}</span></div></div>
      <div class="vrow"><div class="k">一開始</div><div class="v">${pill(R.rMain)}${MAIN[R.rMain.k]}</div></div>
      <div class="vrow"><div class="k">過程中</div><div class="v">互卦上${R.huUp}${TRI[R.huUp].el}：${pill(R.rHu1)}${R.rHu1.t}<br>互卦下${R.huLo}${TRI[R.huLo].el}：${pill(R.rHu2)}${R.rHu2.t}</div></div>
      <div class="vrow"><div class="k">最後</div><div class="v">變卦用位${R.bianYong}${TRI[R.bianYong].el}：${pill(R.rBian)}${R.rBian.t}</div></div>
      <p class="sum">${summary(R,tiStrong)}</p>
    </div>
  </section>

  <section class="panel text" aria-label="經文">
    <h2>經文</h2>
    <div class="block"><h3>本卦　${R.ben.full}</h3><p class="jing">${R.ben.name}：${R.ben.ci}</p>
      <details><summary>看本卦全部爻辭</summary><ol>${R.ben.yao.map((t,i)=>`<li${i+1===R.yr?' class="on"':''}><span>${yaoLabel(i+1,R.lines[i])}</span>${t}</li>`).join('')}</ol></details>
    </div>
    <div class="block hl"><h3>動爻　${mvLabel}</h3><p class="jing">${yaoText}</p></div>
    <div class="block"><h3>互卦　${R.hu.full}</h3><p class="jing">${R.hu.name}：${R.hu.ci}</p></div>
    <div class="block"><h3>變卦　${R.bian.full}</h3><p class="jing">${R.bian.name}：${R.bian.ci}</p></div>
  </section>

  <section class="panel ai" aria-label="Claude 解卦">
    <h2>Claude 解卦</h2>
    <div class="ai-link">
      <p style="margin:0 0 12px;color:var(--muted);font-size:.9rem">按下後會打開 Claude，並帶入整理好的卦象和解卦指示，送出就能看到白話解讀。同時也會複製到剪貼簿，如果 Claude 開啟後沒有帶入文字，直接貼上即可。需要登入 Claude 帳號。</p>
      <div class="ai-btns"><a class="go small" id="openClaude" href="https://claude.ai/new" target="_blank" rel="noopener">到 Claude 解卦</a></div>
      <p class="ai-note" id="linkNote" hidden></p>
    </div>
    <div class="ai-inline" hidden>
    <p style="margin:0 0 12px;color:var(--muted);font-size:.9rem">依體用生剋、旺衰、互卦、變卦與動爻，針對你問的事斷卦，好的壞的都會說。會用到你自己的 Claude 用量，第一次使用會先詢問是否允許。</p>
    <div class="ai-btns">
      <button class="go small" type="button" id="askAi">請 Claude 解卦</button>
      <button class="ghost" type="button" id="stopAi" hidden>停止</button>
      <button class="ghost" type="button" id="reAi" hidden>重新解一次</button>
    </div>
    <div class="ai-out" id="aiOut" aria-live="polite"></div>
    <p class="ai-note" id="aiNote" hidden></p>
    </div>
  </section>

  <section class="panel" aria-label="複製">
    <h2>帶去問 Claude</h2>
    <p style="margin:0 0 10px;color:var(--muted);font-size:.9rem">複製整理好的卦象，貼回對話裡，可以依你問的事情細斷。</p>
    <button class="ghost" type="button" id="copy">複製卦象</button>
    <textarea id="copybox" readonly hidden></textarea>
  </section>`;
  if(aiCtl){aiCtl.abort();aiCtl=null;}
  $('result').innerHTML=html;
  const txt=copyText(R,mvLabel,yaoText);
  aiPrompt=buildPrompt(R,txt);
  const oc=$('openClaude');
  oc.href='https://claude.ai/new?q='+encodeURIComponent(aiPrompt);
  oc.onclick=()=>{
    try{navigator.clipboard.writeText(aiPrompt).then(()=>{$('linkNote').textContent='已複製解卦內容，Claude 沒帶入文字的話請直接貼上。';$('linkNote').hidden=false;}).catch(()=>{});}catch(e){}
  };
  applyAiMode();
  $('askAi').onclick=()=>runAi(false);
  $('reAi').onclick=()=>runAi(true);
  $('stopAi').onclick=()=>{if(aiCtl)aiCtl.abort();};
  $('copy').onclick=async()=>{
    try{await navigator.clipboard.writeText(txt);$('copy').textContent='已複製';}
    catch(e){const box=$('copybox');box.value=txt;box.hidden=false;box.focus();box.select();$('copy').textContent='請手動複製下方文字';}
  };
}

function summary(R,tiStrong){
  const goodCount=[R.rMain,R.rBian].filter(r=>r.cls==='good').length;
  const badCount=[R.rMain,R.rBian].filter(r=>r.cls==='bad').length;
  let s='';
  if(goodCount===2) s='一開始和最後都對你有利，整體偏好。';
  else if(badCount===2) s='一開始和最後都對你不利，整體偏差，做法要保守。';
  else if(R.rBian.cls==='good') s='一開始不一定順，但最後會轉好，先苦後甜。';
  else if(R.rBian.cls==='bad') s='一開始還可以，但後面會變差，要留意後段的變化。';
  else s='好壞參半，成敗看你自己肯不肯出力、時機抓得準不準。';
  s+=tiStrong?'這個月你本身力量足，遇到阻力也撐得住。':'這個月你本身力量偏弱，遇到阻力要更保守。';
  return s;
}
function copyText(R,mvLabel,yaoText){
  return [
    `【梅花易數・數字起卦】${R.q?'\n所問：'+R.q:''}`,
    `起卦數：${mode===3?`${R.a}、${R.b}、${R.c}`:`${R.a}、${R.b}`}${mode===2&&$('useH').checked?`（動爻加時辰 ${hSel.value}）`:''}`,
    `日期：${R.Y}/${R.M}/${R.D}，${R.mb}月，${R.lingEl}當令`,
    `本卦：${R.ben.full}（上${R.up}下${R.lo}），動爻 ${mvLabel}`,
    `互卦：${R.hu.full}`,
    `變卦：${R.bian.full}`,
    `體卦：${R.tiT}${R.tiEl}（${R.wsTi}）；用卦：${R.yongT}${R.yongEl}（${R.wsYong}）`,
    `體用：${R.rMain.k}；互卦 ${R.huUp}${TRI[R.huUp].el}${R.rHu1.k}、${R.huLo}${TRI[R.huLo].el}${R.rHu2.k}；變卦用位 ${R.bianYong}${TRI[R.bianYong].el}${R.rBian.k}`,
    `卦辭：${R.ben.ci}`,
    `動爻爻辭：${yaoText}`,
    `變卦卦辭：${R.bian.ci}`
  ].join('\n');
}
let sampleFn=null, aiCtl=null, aiPrompt='';
(async()=>{
  try{ if(window.claude&&typeof window.claude.use==='function') sampleFn=await window.claude.use('sample'); }catch(e){ sampleFn=null; }
  applyAiMode();
})();
function applyAiMode(){
  const inline=!!sampleFn;
  document.querySelectorAll('.ai-inline').forEach(el=>{el.hidden=!inline;});
  document.querySelectorAll('.ai-link').forEach(el=>{el.hidden=inline;});
}

function buildPrompt(R,txt){
  return `你是精通梅花易數與《周易》的易學老師。以下是一次梅花易數數字起卦的完整卦象，請用繁體中文替問卦者斷卦。問卦者是不懂易經的一般人。

${txt}

斷卦要求：
1. 以體用五行生剋為主、月令旺衰為輔，依序看起始（本卦體用）、過程（互卦）、結果（變卦），最後才用動爻爻辭與卦辭補充細節。體卦代表問卦者自己，用卦代表所問之事。
2. ${R.q?`緊扣所問之事「${R.q}」來斷，把卦象翻譯成這件事的具體情境。`:'問卦者沒有寫明所問之事，請給一般性的吉凶與處事建議。'}
3. 有利與不利的徵兆都要直說，不要只講好話；不利之處也要講清楚會怎麼表現、要防什麼。
4. 給出明確的總體判斷（例如：可行、可行但要注意某事、不宜）和具體建議。
5. 若問的是投資理財，在最後用一句話提醒卦象只是參考，要搭配基本面判斷。
6. 用一般人聽得懂的日常白話，像在跟朋友解釋。易經術語（體卦、用卦、生剋、旺衰、互卦、變卦、動爻）第一次出現時，用一句白話說明它代表什麼，例如「體卦代表你自己」。卦辭、爻辭的古文要先翻成白話，再說它對這件事的意思。多用生活中的比喻，少用文言。
7. 每一段先講結論，再講理由。
8. 用純文字，不要使用 Markdown 符號（不要用 #、*、表格）。用以下段落標題，每個標題獨立一行：
【一句話結論】
【你和這件事的關係】
【過程中會遇到什麼】
【最後會怎樣】
【古書怎麼說】
【給你的建議】
全文約 500 到 800 字。`;
}

const AI_ERR={
  not_granted:'這個頁面沒有被允許使用 Claude。可以改用下方的「複製卦象」，貼到對話裡請 Claude 解。',
  sampling_disabled:'這個帳號目前無法在頁面中使用 Claude。可以改用下方的「複製卦象」。',
  rate_limited:'使用太頻繁或已達用量上限，請稍後再按一次。',
  session_expired:'登入已過期，請重新登入 Claude 後再試。',
  refused:'Claude 沒有回答這次的內容，換個問法再試試。',
  empty_completion:'這次沒有得到回答，請再按一次。'};
const AI_HIDE=['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'];

async function runAi(fresh){
  if(!sampleFn||!aiPrompt) return;
  if(aiCtl) aiCtl.abort();
  const ctl=new AbortController(); aiCtl=ctl;
  const out=$('aiOut'), note=$('aiNote'), ask=$('askAi'), stop=$('stopAi'), re=$('reAi');
  out.textContent='Claude 正在看卦……'; out.classList.add('wait');
  note.hidden=true; ask.disabled=true; re.hidden=true; stop.hidden=false;
  const opts={signal:ctl.signal,onText:({text})=>{out.classList.remove('wait');out.textContent=text;}};
  if(fresh) opts.cache=false;
  try{
    const {truncated}=await sampleFn(aiPrompt,opts);
    if(truncated){note.textContent='回答太長被截斷了，可以按「重新解一次」。';note.hidden=false;}
    re.hidden=false;
  }catch(e){
    if(aiCtl!==ctl) return;
    out.classList.remove('wait');
    if(e&&e.code==='refused') out.textContent=''; else out.textContent=(e&&e.text)||'';
    if(e&&e.code==='cancelled'){ if(!out.textContent){note.textContent='已停止。';note.hidden=false;} re.hidden=false; }
    else{
      note.textContent=AI_ERR[e&&e.code]||'連線中斷了，請再按一次。'; note.hidden=false;
      if(AI_HIDE.includes(e&&e.code)) ask.hidden=true; else re.hidden=false;
    }
  }finally{
    if(aiCtl===ctl){ aiCtl=null; ask.disabled=false; stop.hidden=true; }
  }
}

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

$('f').addEventListener('submit',e=>{e.preventDefault();cast(false);});

$('a').value='16';$('b').value='7';$('q').value='';
cast(true);
$('a').value='';$('b').value='';
